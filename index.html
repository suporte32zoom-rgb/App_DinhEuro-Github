    <!-- Registro defensivo e assíncrono do Service Worker (PWA dinheuro-v2-cache) -->
    <script>
      (function() {
        // Failsafe não-destrutivo: se o bundle demorar mais de 6 segundos, exibe botão de recarga sem esvaziar a tela
        setTimeout(function() {
          var splash = document.getElementById('dinheuro-splash');
          if (splash && splash.parentElement) {
            var badge = splash.querySelector('div:last-child');
            if (badge) {
              badge.innerHTML = '<span style="color:#E5A910;">Sincronização estendida</span> &bull; <a href="javascript:window.location.reload()" style="color:#009B77;font-weight:700;text-decoration:underline;margin-left:4px;">Recarregar</a>';
            }
          }
        }, 6000);

        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('./sw.js', { scope: './' })
              .then(function(registration) {
                console.log('[DinhEuro PWA] Service Worker registrado:', registration.scope);
              })
              .catch(function(err) {
                console.warn('[DinhEuro PWA] Falha ao registrar Service Worker:', err);
              });
          });
        }
      })();
    </script>
