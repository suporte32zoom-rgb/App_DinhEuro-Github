name: Build and Deploy DinhEuro to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Build Production Assets
        run: |
          npm run build
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          VITE_FINNHUB_API_KEY: ${{ secrets.VITE_FINNHUB_API_KEY || secrets.FINNHUB_API_KEY }}
          FINNHUB_WEBHOOK_SECRET: ${{ secrets.FINNHUB_WEBHOOK_SECRET }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          VITE_FMP_API_KEY: ${{ secrets.VITE_FMP_API_KEY || secrets.FMP_API_KEY }}
          VITE_AWESOME_ECONOMY_URL: ${{ secrets.VITE_AWESOME_ECONOMY_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}

      - name: Prepare Static Artifacts for GitHub Pages
        run: |
          if [ -f public/CNAME ]; then
            cp public/CNAME dist/CNAME
          elif [ -f CNAME ]; then
            cp CNAME dist/CNAME
          else
            echo "dinheuro.com" > dist/CNAME
          fi

          touch dist/.nojekyll

          if [ -f dist/index.html ] && [ ! -f dist/404.html ]; then
            cp dist/index.html dist/404.html
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: dinheuro-page
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: dinheuro-page
